# PRODUCTION path — uncomment after you populate Infisical with:
#   /open-seo/CONTENTX_CERT_KEY        = <64-hex>
#   /open-seo/CONTENTX_WEBHOOK_SECRET  = <64-hex>
#
# This replaces 30-secret-bootstrap.yaml. The webhook deployment references
# `contentx-webhook-secrets` regardless of source, so swapping in this file
# is a no-downtime cutover (ESO will rewrite the Secret in-place).
# ---
# apiVersion: external-secrets.io/v1
# kind: ExternalSecret
# metadata:
#   name: contentx-webhook-secrets
#   namespace: content-factory
# spec:
#   secretStoreRef:
#     name: infisical-toba-prod
#     kind: ClusterSecretStore
#   target:
#     name: contentx-webhook-secrets
#     creationPolicy: Owner
#   refreshInterval: 1h
#   data:
#     - secretKey: CONTENTX_CERT_KEY
#       remoteRef:
#         key: CONTENTX_CERT_KEY
#     - secretKey: CONTENTX_WEBHOOK_SECRET
#       remoteRef:
#         key: CONTENTX_WEBHOOK_SECRET
