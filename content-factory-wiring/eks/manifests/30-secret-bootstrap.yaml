# Bootstrap secret — DEV/CANARY ONLY.
#
# For production, replace this with the ExternalSecret in 31-externalsecret.yaml
# (pointing at Infisical via the existing ClusterSecretStore infisical-toba-prod)
# OR with `kubectl create secret` from vault values.
#
# Values below are sealed at apply time by `deploy/07_deploy_eks.sh` so we
# never commit a real secret; the file ships with placeholders that the
# script substitutes with `openssl rand -hex 32`.
apiVersion: v1
kind: Secret
metadata:
  name: contentx-webhook-secrets
  namespace: content-factory
  labels:
    app.kubernetes.io/name: contentx-postiz-webhook
    app.kubernetes.io/managed-by: deploy-07-script
  annotations:
    contentx.io/rotate-after: "2026-06-26T00:00:00Z"
type: Opaque
stringData:
  CONTENTX_CERT_KEY:        "REPLACE_AT_APPLY_TIME"
  CONTENTX_WEBHOOK_SECRET:  "REPLACE_AT_APPLY_TIME"
