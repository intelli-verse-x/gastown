apiVersion: apps/v1
kind: Deployment
metadata:
  name: contentx-postiz-webhook
  namespace: content-factory
  labels:
    app.kubernetes.io/name: contentx-postiz-webhook
    app.kubernetes.io/component: webhook
    app.kubernetes.io/version: "1.0.0"
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: contentx-postiz-webhook
  template:
    metadata:
      labels:
        app.kubernetes.io/name: contentx-postiz-webhook
        app.kubernetes.io/component: webhook
      annotations:
        # Force restart on configmap rotation
        contentx.io/config-hash: "REPLACE_AT_APPLY_TIME"
    spec:
      serviceAccountName: contentx-postiz-webhook
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 30
      containers:
        - name: webhook
          image: IMAGE_PLACEHOLDER
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8421
              protocol: TCP
          envFrom:
            - configMapRef:
                name: contentx-webhook-config
            - secretRef:
                name: contentx-webhook-secrets
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            failureThreshold: 30
            periodSeconds: 2
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 30
            failureThreshold: 6
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: working-dir
              mountPath: /var/lib/contentx
              readOnly: false
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
        - name: working-dir
          emptyDir:
            sizeLimit: 4Gi
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: contentx-postiz-webhook
