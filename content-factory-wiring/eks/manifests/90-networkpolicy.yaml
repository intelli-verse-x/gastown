apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: contentx-postiz-webhook
  namespace: content-factory
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: contentx-postiz-webhook
  policyTypes: ["Ingress", "Egress"]
  ingress:
    # Allow from ALB ingress + intra-namespace traffic
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: content-factory
      ports:
        - protocol: TCP
          port: 8421
  egress:
    # DNS
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # HTTPS to Postiz API + Infisical + ECR + STS
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except: ["169.254.169.254/32"]
      ports:
        - protocol: TCP
          port: 443
